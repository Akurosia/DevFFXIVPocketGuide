<!-- Lightweight sidebar shell. The expensive menu tree is generated once at
     /assets/generated/navigation.html and loaded by sidebar-state.js. -->
<button class="sidebar__trigger xiv-button" type="button" aria-controls="pocket-guide-sidebar" aria-expanded="false">
    <span class="sidebar__trigger-inactive">
        <ion-icon name="chevron-down-outline" aria-hidden="true"></ion-icon>
        <span data-translate="Navbar_Mobile_Menu">Menu</span>
    </span>
    <span class="sidebar__trigger-active">
        <ion-icon name="chevron-up-outline" aria-hidden="true"></ion-icon>
        <span data-translate="Navbar_Mobile_Close">Close</span>
    </span>
</button>
<div class="site-grid__sidebar-overlay" aria-hidden="true"></div>
<aside id="pocket-guide-sidebar" class="sidebar" aria-label="Pocket Guide navigation" data-sidebar-navigation>
    <div class="sidebar__wrapper">
        <div class="languages" aria-label="Language">
            <button type="button" style="background-image: url('{{ "/assets/img/flags.webp" | prepend: site.baseurl }}')" class="flags_img iso_US" onclick="changeLanguageTo('lang-toogle-en', 'en-US')" aria-label="English"></button>
            <button type="button" style="background-image: url('{{ "/assets/img/flags.webp" | prepend: site.baseurl }}')" class="flags_img iso_DE" onclick="changeLanguageTo('lang-toogle-de', 'de-DE')" aria-label="Deutsch"></button>
            <button type="button" style="background-image: url('{{ "/assets/img/flags.webp" | prepend: site.baseurl }}')" class="flags_img iso_FR" onclick="changeLanguageTo('lang-toogle-fr', 'fr-FR')" aria-label="Français"></button>
            <button type="button" style="background-image: url('{{ "/assets/img/flags.webp" | prepend: site.baseurl }}')" class="flags_img iso_JP" onclick="changeLanguageTo('lang-toogle-ja', 'ja-JP')" aria-label="日本語"></button>
        </div>
        <h1 class="sidebar__title">
            <a href='{{ "/" | prepend: site.baseurl }}' title="Return to the Pocket Guide Home Page.">
                <img alt="FFXIV Pocket Guide" src='{{ "/assets/img/icon.svg" | prepend: site.baseurl }}'>
                <span class="sidebar__home-label">Pocket Guide</span>
            </a>
        </h1>
        <div class="sidebar__navigation-host"
             data-sidebar-source="{{ '/assets/generated/navigation.html' | prepend: site.baseurl }}"
             aria-live="polite">
            <div class="sidebar__loading" role="status">Loading navigation…</div>
        </div>
    </div>
</aside>
