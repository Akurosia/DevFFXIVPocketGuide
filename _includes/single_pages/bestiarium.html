<section
    class="bestiarium-page"
    id="bestiariumApp"
    data-game-assets-url="{{ site.imageurl }}"
>
    <div class="bestiarium-window">
        <aside class="bestiarium-sidebar" aria-label="Bestiarium Navigation">
            <header class="bestiarium-sidebar__header">
                <span class="bestiarium-sidebar__eyebrow">Bestiarium</span>
                <strong class="bestiarium-sidebar__title">Klasse</strong>
            </header>

            <div class="bestiarium-category-grid" id="bestiariumCategoryGrid"></div>

            <section class="bestiarium-ranks">
                <div class="bestiarium-ranks__title">Rang</div>
                <div class="bestiarium-ranks__list" id="bestiariumRankList"></div>
            </section>

            <div class="bestiarium-sidebar__actions">
                <button type="button" class="xiv-button xiv-button--small xiv-button--ghost" id="bestiariumResetProgress">
                    Fortschritt zurücksetzen
                </button>
            </div>
        </aside>

        <main class="bestiarium-main">
            <div class="bestiarium-loading xiv-notice" id="bestiariumLoading">Bestiarium wird geladen …</div>
            <div class="bestiarium-error xiv-notice xiv-notice--danger" id="bestiariumError" hidden>
                Die Bestiarium-Daten konnten nicht geladen werden.
            </div>

            <div class="bestiarium-content" id="bestiariumContent" hidden>
                <header class="bestiarium-header">
                    <div class="bestiarium-header__class">
                        <img id="bestiariumClassIcon" class="bestiarium-header__class-icon" alt="">
                        <div>
                            <span class="bestiarium-header__label">Klasse</span>
                            <h1 class="bestiarium-header__title" id="bestiariumTitle"></h1>
                        </div>
                    </div>

                    <div class="bestiarium-header__progress">
                        <strong id="bestiariumCompletedTotal">0/0</strong>
                        <span>Einträge abgeschlossen</span>
                    </div>
                </header>

                <div class="bestiarium-rank-header">
                    <div class="bestiarium-rank-header__title-wrap">
                        <span class="bestiarium-rank-header__label" id="bestiariumRankTitle">Rang 1</span>
                        <span class="bestiarium-rank-header__status" id="bestiariumRankStatus"></span>
                    </div>
                    <div class="bestiarium-rank-header__reward">
                        <span>Vergütung</span>
                        <strong id="bestiariumRankReward">0</strong>
                    </div>
                </div>

                <div class="bestiarium-toolbar">
                    <button class="xiv-button xiv-button--small" id="bestiariumShowAll" type="button">Alle anzeigen</button>
                    <button class="xiv-button xiv-button--small xiv-button--ghost" id="bestiariumCompleteRank" type="button">Rang abschließen</button>
                    <span class="bestiarium-toolbar__hint" id="bestiariumToolbarHint"></span>
                </div>

                <div class="bestiarium-notes" id="bestiariumNotes"></div>
            </div>
        </main>
    </div>
</section>

<script id="bestiariumData" type="application/json">{{ page.bestiarium_categories | jsonify }}</script>
<script type="text/javascript" src="{{ '/assets/js/bestiarium.js' | prepend: site.baseurl }}?{{site.time | date: '%s%N'}}"></script>
