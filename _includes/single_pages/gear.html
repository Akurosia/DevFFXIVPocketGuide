<!-- Include from _includes/gear -->
<div class="index gear-page">
  <div class="container gear-page__container">
    <section id="filterOptions" class="gear-filters xiv-panel" aria-label="Ausrüstungsfilter">
      <div class="gear-filters__primary">
        <label class="gear-filter-field gear-filter-field--job">
          <span class="gear-filter-label">Klasse / Job</span>
          <select class="xiv-select" id="classjob" size="1">
              <option data-translate="Content_Title_Paladin"       value="PLD">Paladin</option>
              <option data-translate="Content_Title_Warrior"      value="KRG">Krieger</option>
              <option data-translate="Content_Title_Dark Knight"  value="DKR">Dunkelritter</option>
              <option data-translate="Content_Title_Gunbreaker"   value="REV">Revolverklinge</option>
              <option data-translate="Content_Title_White Mage"   value="WMA">Weißmagier</option>
              <option data-translate="Content_Title_Scholar"      value="GLT">Gelehrter</option>
              <option data-translate="Content_Title_Astrologian"  value="AST">Astrologe</option>
              <option data-translate="Content_Title_Sage"         value="WEI">Weiser</option>
              <option data-translate="Content_Title_Monk"         value="MÖN">Mönch</option>
              <option data-translate="Content_Title_Dragoon"      value="DRG">Dragoon</option>
              <option data-translate="Content_Title_Ninja"        value="NIN">Ninja</option>
              <option data-translate="Content_Title_Samurai"      value="SAM">Samurai</option>
              <option data-translate="Content_Title_Reaper"       value="SNT">Schnitter</option>
              <option data-translate="Content_Title_Viper"        value="VPR">Viper</option>
              <option data-translate="Content_Title_Bard"         value="BRD">Barde</option>
              <option data-translate="Content_Title_Machinist"    value="MCH">Maschinist</option>
              <option data-translate="Content_Title_Dancer"       value="TÄN">Tänzer</option>
              <option data-translate="Content_Title_Summoner"     value="BSW">Beschwörer</option>
              <option data-translate="Content_Title_Black Mage"   value="SMA">Schwarzmagier</option>
              <option data-translate="Content_Title_Red Mage"     value="RMA" selected>Rotmagier</option>
              <option data-translate="Content_Title_Blue Mage"    value="BMA">Blaumagier</option>
              <option data-translate="Content_Title_Pictomancer"  value="PKT">Piktomant</option>
              <option data-translate="Content_Title_Carpenter"    value="ZMR">Zimmerer</option>
              <option data-translate="Content_Title_Blacksmith"   value="GRS">Grobschmied</option>
              <option data-translate="Content_Title_Armorer"      value="PLA">Plattner</option>
              <option data-translate="Content_Title_Goldsmith"    value="GLD">Goldschmied</option>
              <option data-translate="Content_Title_Leatherworker"value="GER">Gerber</option>
              <option data-translate="Content_Title_Weaver"       value="WEB">Weber</option>
              <option data-translate="Content_Title_Alchemist"    value="ALC">Alchemist</option>
              <option data-translate="Content_Title_Culinarian"   value="GRM">Gourmet</option>
              <option data-translate="Content_Title_Miner"        value="MIN">Minenarbeiter</option>
              <option data-translate="Content_Title_Botanist"     value="GÄR">Gärtner</option>
              <option data-translate="Content_Title_Fisher"       value="FIS">Fischer</option>
          </select>
        </label>

        <div class="gear-filter-range">
          <span class="gear-filter-label">Level</span>
          <div class="gear-filter-range__inputs">
            <label><span>Von</span><input class="xiv-input" type="number" id="lvl_from" min="1" max="100"></label>
            <label><span>Bis</span><input class="xiv-input" type="number" id="lvl_to" min="1" max="100"></label>
          </div>
        </div>

        <div class="gear-filter-range">
          <span class="gear-filter-label">Item-Level</span>
          <div class="gear-filter-range__inputs">
            <label><span>Von</span><input class="xiv-input" type="number" id="ilvl_from" min="1" max="999"></label>
            <label><span>Bis</span><input class="xiv-input" type="number" id="ilvl_to" min="1" max="999"></label>
          </div>
        </div>

        <button class="xiv-button xiv-button--primary gear-search-button"
                type="button"
                onclick="call_api_data()"
                data-value-translate="Gear_Search">
          Suchen
        </button>
      </div>

      <div class="gear-filters__secondary">
        <div class="gear-filter-group">
          <span class="gear-filter-label">Seltenheit</span>
          <div class="gear-toggle-row">
            <label class="gear-toggle gear-toggle--normal" title="Normale / weiße Ausrüstung">
              <input type="checkbox" id="rarity_0">
              <span class="gear-toggle__swatch"></span>
              <span>Normal</span>
            </label>
            <label class="gear-toggle gear-toggle--relic" title="Relikt-/Spezialausrüstung">
              <input type="checkbox" id="rarity_7">
              <span class="gear-toggle__swatch"></span>
              <span>Relikt</span>
            </label>
            <label class="gear-toggle gear-toggle--green" title="Grüne Ausrüstung">
              <input type="checkbox" id="rarity_2">
              <span class="gear-toggle__swatch"></span>
              <span>Grün</span>
            </label>
            <label class="gear-toggle gear-toggle--blue" title="Blaue Ausrüstung">
              <input type="checkbox" id="rarity_3">
              <span class="gear-toggle__swatch"></span>
              <span>Blau</span>
            </label>
            <label class="gear-toggle gear-toggle--purple" title="Lila Ausrüstung">
              <input type="checkbox" id="rarity_4">
              <span class="gear-toggle__swatch"></span>
              <span>Lila</span>
            </label>
          </div>
        </div>

        <div class="gear-filter-group">
          <span class="gear-filter-label">Qualität</span>
          <div class="gear-toggle-row">
            <label class="gear-toggle" title="HQ-Gegenstände zusätzlich anzeigen">
              <input type="checkbox" id="include_hq" checked>
              <span>HQ einschließen</span>
            </label>
            <label class="gear-toggle" title="Wenn NQ und HQ existieren, nur HQ anzeigen">
              <input type="checkbox" id="limit_to_hq">
              <span>Nur HQ-Duplikate</span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <div class="gear-results-heading">
      <div>
        <h2>Ausrüstung</h2>
        <p>Wähle pro Slot einen Gegenstand aus. Angezeigt werden nur die für den gewählten Job relevanten Werte.</p>
      </div>
      <span id="gear-result-summary" class="xiv-badge">Lade …</span>
    </div>

    <div id="gearlist" class="gear-slot-list">
      <section class="gear-slot-shell" id="weapon_left"></section>
      <section class="gear-slot-shell" id="weapon_right"></section>
      <section class="gear-slot-shell" id="kopf"></section>
      <section class="gear-slot-shell" id="rumpf"></section>
      <section class="gear-slot-shell" id="hände"></section>
      <section class="gear-slot-shell" id="beine"></section>
      <section class="gear-slot-shell" id="füße"></section>
      <section class="gear-slot-shell" id="ohrring"></section>
      <section class="gear-slot-shell" id="halskette"></section>
      <section class="gear-slot-shell" id="armreif"></section>
      <section class="gear-slot-shell" id="ring_links"></section>
      <section class="gear-slot-shell" id="ring_rechts"></section>
    </div>
  </div>

  <aside class="gear-summary-bar" aria-label="Gewählte Ausrüstung – Werte">
    <div class="gear-summary-bar__scroll">
      <table class="xiv-table xiv-stat-table" id="table_stats_overview"></table>
    </div>
  </aside>
</div>
<script type="text/javascript" src="{{ "/assets/js/gear.js" | prepend: site.baseurl }}?{{site.time | date: '%s%N'}}"></script>
<!-- END Include from _includes/gear -->
