name: Jekyll site CI

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Jekyll
        if: ${{ !hashFiles('Gemfile') }}
        run: |
          gem install jekyll bundler --no-document

      - name: Build site
        run: |
          if [ -f Gemfile ]; then
            bundle exec jekyll build --future --config _config.yml,_githubconfig.yml
          else
            jekyll build --future --config _config.yml,_githubconfig.yml
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
